<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My War Stats</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#2b2a2a">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141313">
</head>
<body>
<h1><img src="icons/clan-badge.svg" alt="" class="badge">My War Stats</h1>
<div id="sub">Your own war progress and history</div>

<section class="step">
  <div class="row">
    <label class="tagin"><span>#</span><input id="tag" placeholder="YOUR PLAYER TAG" autocomplete="off" spellcheck="false" aria-label="Your player tag"></label>
    <button class="btn main" id="go">Show</button>
  </div>
  <div class="hint" style="margin-top:6px">Your tag is under your name on your Clash Royale profile.</div>
  <div class="status" id="status" role="status"></div>
</section>

<div id="out"></div>

<details class="step" id="explainbox">
  <summary>Clan rules explained</summary>
  <div id="explain"></div>
</details>

<footer class="fanpolicy">This material is unofficial and is not endorsed by Supercell. For more information see <a href="https://supercell.com/en/fan-content-policy/" target="_blank" rel="noopener">Supercell's Fan Content Policy</a>.</footer>
<script src="logic.js"></script>
<script src="stats.js"></script>
<script src="ui.js"></script>
<script src="me.js"></script>
</body>
</html>
