<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#WINNING War Audit</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #3fb950;
    --red: #f85149;
    --orange: #d29922;
    --yellow: #e3b341;
    --blue: #58a6ff;
    --cyan: #39c5cf;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 1.45; padding: 12px; max-width: 1100px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; }
  .brand { font-family: monospace; font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .tag { color: var(--muted); font-size: 12px; font-weight: 400; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pill-group { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .pill-btn { background: transparent; color: var(--muted); border: none; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .pill-btn.active { background: var(--accent); color: #000; }
  .btn { background: #21262d; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .tab { background: var(--card); color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .tab.active { color: var(--text); border-color: var(--accent); }
  .filter-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--card); border: 1px solid var(--border); color: var(--muted); border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: monospace; }
  .chip.active { color: var(--text); border-color: var(--text); }
  input[type="text"], input[type="number"], select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; font-size: 12px; }
  .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: none; }
  .mono { font-family: monospace; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 700; font-family: monospace; }
  .b-Kick, .b-Out { background: rgba(248,81,73,0.18); color: var(--red); border: 1px solid rgba(248,81,73,0.4); }
  .b-Demote { background: rgba(210,153,34,0.18); color: var(--orange); border: 1px solid rgba(210,153,34,0.4); }
  .b-Warn, .b-Risk { background: rgba(227,179,65,0.18); color: var(--yellow); border: 1px solid rgba(227,179,65,0.4); }
  .b-Hold { background: rgba(88,166,255,0.18); color: var(--blue); border: 1px solid rgba(88,166,255,0.4); }
  .b-Promote { background: rgba(63,185,80,0.18); color: var(--accent); border: 1px solid rgba(63,185,80,0.4); }
  .b-Boats { background: rgba(57,197,207,0.18); color: var(--cyan); border: 1px solid rgba(57,197,207,0.4); }
  .b-Safe, .b-Exempt { background: rgba(139,148,158,0.15); color: var(--muted); border: 1px solid rgba(139,148,158,0.3); }
  .role-tag { font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 3px; padding: 1px 4px; margin-left: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 13px; }
  textarea { width: 100%; min-height: 135px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px; font-family: monospace; font-size: 12px; resize: vertical; }
  .rules-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .rule-item { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="brand">#WINNING <span class="tag">#PPCCR8VU</span></div>
  <div class="controls">
    <div class="pill-group">
      <button class="pill-btn active" id="modeEnd" onclick="setMode('end')">End of War</button>
      <button class="pill-btn" id="modeLive" onclick="setMode('live')">Day 4 Live</button>
    </div>
    <label class="btn">
      Upload CSVs
      <input type="file" id="csvInput" multiple accept=".csv" style="display:none" onchange="handleFiles(this.files)">
    </label>
    <button class="btn" onclick="exportMd()">Export .md</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" id="tabBtn-audit" onclick="showTab('audit')">Audit</button>
  <button class="tab" id="tabBtn-chat" onclick="showTab('chat')">Chat</button>
  <button class="tab" id="tabBtn-rules" onclick="showTab('rules')">Rules</button>
</div>

<section id="tab-audit">
  <div class="filter-bar">
    <div class="chips" id="filterChips"></div>
    <input type="text" id="searchInput" placeholder="Filter name..." oninput="render()">
  </div>
  <div class="table-wrap">
    <table>
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</section>

<section id="tab-chat" class="hidden">
  <div class="grid" id="chatGrid"></div>
</section>

<section id="tab-rules" class="hidden">
  <div class="rules-grid">
    <div class="rule-item"><span>Weekly target</span><input type="number" id="rTarget" value="1800" step="50" onchange="render()"></div>
    <div class="rule-item"><span>Mid-week / day</span><input type="number" id="rDaily" value="450" step="50" onchange="render()"></div>
    <div class="rule-item"><span>Pass if 100% decks</span><input type="checkbox" id="rFullDecks" checked onchange="render()"></div>
    <div class="rule-item"><span>Demote Elders 1st miss</span><input type="checkbox" id="rDemoteElder" checked onchange="render()"></div>
    <div class="rule-item"><span>Spare active boat players</span><input type="checkbox" id="rSpareBoats" checked onchange="render()"></div>
    <div class="rule-item"><span>Hold regulars (5+ wks, 3d+ off)</span><input type="checkbox" id="rHoldVet" checked onchange="render()"></div>
    <div class="rule-item"><span>Promote streak (wks)</span><input type="number" id="rPromoWks" value="6" min="1" max="10" onchange="render()"></div>
    <div class="rule-item"><button class="btn" onclick="resetRules()">Reset defaults</button></div>
  </div>
</section>

<script>
let mode = 'end';
let activeFilter = 'All';

const defaultPlayers = [
  { tag:'VL8QL9LY2', name:'Manny1', role:'member', fame:0, decks:0, boats:0, usedToday:0, wks:1, passWks:0, consecUnder:1, priorPass:0, avg:0, offlineDays:0, joined:'Full', override:'Auto' },
  { tag:'V2CGGRUVR', name:'ty', role:'member', fame:650, decks:6, boats:4, usedToday:0, wks:1, passWks:0, consecUnder:1, priorPass:0, avg:650, offlineDays:0, joined:'Full', override:'Auto' },
  { tag:'9QGPVCGLJ', name:'bestgirlclasher', role:'member', fame:1350, decks:8, boats:0, usedToday:0, wks:10, passWks:6, consecUnder:2, priorPass:6, avg:1815, offlineDays:0, joined:'Full', override:'Auto' },
  { tag:'2LGYY2L2L', name:'notorious mike', role:'elder', fame:1450, decks:9, boats:0, usedToday:1, wks:10, passWks:9, consecUnder:1, priorPass:9, avg:2660, offlineDays:0, joined:'Full', override:'Auto' },
  { tag:'202GJVRCPL', name:'Pirate Steve', role:'coLeader', fame:0, decks:0, boats:0, usedToday:0, wks:10, passWks:9, consecUnder:1, priorPass:9, avg:2575, offlineDays:5, joined:'Full', override:'Auto' },
  { tag:'YVJRGLCC', name:'perc', role:'member', fame:1500, decks:16, boats:16, usedToday:4, wks:5, passWks:1, consecUnder:2, priorPass:1, avg:1675, offlineDays:0, joined:'Full', override:'Auto' },
  { tag:'RQP29Y9J', name:'boi in a jar', role:'member', fame:1750, decks:16, boats:16, usedToday:4, wks:4, passWks:2, consecUnder:2, priorPass:2, avg:1800, offlineDays:0, joined:'Full', override:'Auto' },
  { tag:'2PC8V0L9P', name:'Mohammad nazari', role:'member', fame:1025, decks:9, boats:9, usedToday:1, wks:1, passWks:0, consecUnder:1, priorPass:0, avg:1025, offlineDays:0, joined:'Full', override:'Auto' },
  { tag:'P2J9GR99', name:'stuart', role:'member', fame:1800, decks:16, boats:16, usedToday:4, wks:6, passWks:5, consecUnder:0, priorPass:4, avg:1762, offlineDays:0, joined:'Full', override:'Auto' },
  { tag:'22V9LR22G', name:'mattmk', role:'member', fame:1700, decks:13, boats:0, usedToday:1, wks:6, passWks:4, consecUnder:1, priorPass:4, avg:1950, offlineDays:0, joined:'Full', override:'Warn' },
  { tag:'VPY8R2QRL', name:'Bob', role:'member', fame:1100, decks:8, boats:0, usedToday:0, wks:2, passWks:1, consecUnder:1, priorPass:1, avg:1850, offlineDays:0, joined:'Full', override:'Warn' },
  { tag:'2YC0CUUYP', name:'Thomas king', role:'member', fame:600, decks:4, boats:0, usedToday:0, wks:6, passWks:5, consecUnder:1, priorPass:5, avg:1788, offlineDays:0, joined:'Full', override:'Warn' },
  { tag:'YCU8RGVJY', name:'brayyisaac', role:'member', fame:500, decks:4, boats:0, usedToday:4, wks:1, passWks:0, consecUnder:1, priorPass:0, avg:500, offlineDays:0, joined:'Sat', override:'Auto' },
  { tag:'UU0UVRJV9', name:'>FRXNCHY<', role:'member', fame:0, decks:0, boats:0, usedToday:0, wks:1, passWks:0, consecUnder:1, priorPass:0, avg:0, offlineDays:0, joined:'Exempt', override:'Auto' },
  { tag:'9R2UUCVY', name:'Ninja', role:'member', fame:1650, decks:12, boats:0, usedToday:4, wks:7, passWks:6, consecUnder:1, priorPass:6, avg:2621, offlineDays:0, joined:'Full', override:'Promote' },
  { tag:'2VJ9V2PV', name:'Luke', role:'member', fame:2650, decks:16, boats:0, usedToday:4, wks:10, passWks:10, consecUnder:0, priorPass:9, avg:2390, offlineDays:0, joined:'Full', override:'Auto' },
  { tag:'YPQY02YU', name:'AzzA', role:'member', fame:2500, decks:16, boats:0, usedToday:4, wks:10, passWks:10, consecUnder:0, priorPass:9, avg:2270, offlineDays:0, joined:'Full', override:'Auto' },
  { tag:'URJVRPP9Y', name:'Veiz', role:'member', fame:2200, decks:12, boats:0, usedToday:4, wks:9, passWks:9, consecUnder:0, priorPass:8, avg:2494, offlineDays:0, joined:'Full', override:'Auto' },
  { tag:'CLY8YRL', name:'Marcus.B:)', role:'member', fame:2950, decks:16, boats:0, usedToday:4, wks:6, passWks:6, consecUnder:0, priorPass:5, avg:2592, offlineDays:0, joined:'Full', override:'Auto' },
  { tag:'RCC9VYY0G', name:'Spud', role:'member', fame:2700, decks:16, boats:0, usedToday:4, wks:10, passWks:9, consecUnder:0, priorPass:8, avg:2395, offlineDays:0, joined:'Full', override:'Auto' }
];

let players = JSON.parse(JSON.stringify(defaultPlayers));

function getRules() {
  return {
    target: Number(document.getElementById('rTarget').value) || 1800,
    daily: Number(document.getElementById('rDaily').value) || 450,
    fullDecks: document.getElementById('rFullDecks').checked,
    demoteElder: document.getElementById('rDemoteElder').checked,
    spareBoats: document.getElementById('rSpareBoats').checked,
    holdVet: document.getElementById('rHoldVet').checked,
    promoWks: Number(document.getElementById('rPromoWks').value) || 6
  };
}

function evalPlayer(p, r) {
  if (p.override !== 'Auto') return { status: p.override, target: r.target, maxGain: 0 };
  const daysLeftMap = { Full: 4, Thu: 3, Fri: 2, Sat: 1, Sun: 0, Exempt: 0 };
  const dLeft = daysLeftMap[p.joined] ?? 4;
  const reqFame = p.joined === 'Full' ? r.target : dLeft * r.daily;
  const reqDecks = dLeft * 4;

  if (mode === 'live') {
    if (p.joined === 'Exempt' || p.joined === 'Sun') return { status: 'Exempt', target: 0, maxGain: 0 };
    const rem = Math.max(0, 4 - (p.usedToday || 0));
    const gainMap = { 4: 900, 3: 700, 2: 400, 1: 200, 0: 0 };
    const maxGain = gainMap[rem] || 0;
    if (p.fame >= reqFame) return { status: 'Safe', target: reqFame, maxGain };
    if (p.fame + maxGain < reqFame) return { status: 'Out', target: reqFame, maxGain };
    return { status: 'Risk', target: reqFame, maxGain };
  }

  if (p.joined === 'Exempt' || p.joined === 'Sun') return { status: 'Exempt', target: 0, maxGain: 0 };
  const passed = p.fame >= reqFame || (r.fullDecks && reqDecks > 0 && p.decks >= reqDecks);

  if (passed) {
    if (p.role === 'member' && p.passWks >= r.promoWks && p.fame >= r.target) return { status: 'Promote', target: reqFame };
    if (p.boats > 0 && p.boats / Math.max(1, p.decks) >= 0.25) return { status: 'Boats', target: reqFame };
    return { status: 'Safe', target: reqFame };
  }

  if (r.holdVet && p.priorPass >= 5 && p.fame === 0 && p.offlineDays >= 3) return { status: 'Hold', target: reqFame };
  if (r.spareBoats && p.boats >= 8) return { status: 'Warn', target: reqFame };
  if (r.demoteElder && (p.role === 'elder' || p.role === 'coLeader')) return { status: 'Demote', target: reqFame };
  return { status: 'Kick', target: reqFame };
}

function boatMath(p) {
  const w = Math.max(0, Math.round((p.fame - 75 * p.boats) / 50));
  const l = Math.max(0, p.boats - w);
  const pvp = 200 * w + 100 * l;
  return { w, l, pvp };
}

function setMode(m) {
  mode = m;
  document.getElementById('modeEnd').classList.toggle('active', m === 'end');
  document.getElementById('modeLive').classList.toggle('active', m === 'live');
  activeFilter = 'All';
  render();
}

function showTab(t) {
  ['audit', 'chat', 'rules'].forEach(id => {
    document.getElementById('tab-' + id).classList.toggle('hidden', id !== t);
    document.getElementById('tabBtn-' + id).classList.toggle('active', id === t);
  });
}

function resetRules() {
  document.getElementById('rTarget').value = 1800;
  document.getElementById('rDaily').value = 450;
  document.getElementById('rFullDecks').checked = true;
  document.getElementById('rDemoteElder').checked = true;
  document.getElementById('rSpareBoats').checked = true;
  document.getElementById('rHoldVet').checked = true;
  document.getElementById('rPromoWks').value = 6;
  players = JSON.parse(JSON.stringify(defaultPlayers));
  render();
}

function render() {
  const r = getRules();
  const q = document.getElementById('searchInput').value.toLowerCase();
  const evaluated = players.map((p, idx) => ({ ...p, idx, ...evalPlayer(p, r) }));

  const order = mode === 'end'
    ? ['All', 'Kick', 'Demote', 'Warn', 'Hold', 'Promote', 'Boats', 'Exempt', 'Safe']
    : ['All', 'Out', 'Risk', 'Safe', 'Exempt'];

  const counts = { All: evaluated.length };
  order.slice(1).forEach(k => counts[k] = evaluated.filter(x => x.status === k).length);

  document.getElementById('filterChips').innerHTML = order.map(k =>
    `<button class="chip ${activeFilter === k ? 'active' : ''}" onclick="activeFilter='${k}';render()">${k} (${counts[k] || 0})</button>`
  ).join('');

  const filtered = evaluated.filter(p =>
    (activeFilter === 'All' || p.status === activeFilter) &&
    p.name.toLowerCase().includes(q)
  );

  if (mode === 'live') {
    filtered.sort((a, b) => {
      const rank = { Out: 0, Risk: 1, Safe: 2, Exempt: 3 };
      if (rank[a.status] !== rank[b.status]) return rank[a.status] - rank[b.status];
      return (a.usedToday - b.usedToday) || (a.fame - b.fame);
    });
  } else {
    const rank = { Kick: 0, Demote: 1, Warn: 2, Hold: 3, Boats: 4, Promote: 5, Exempt: 6, Safe: 7 };
    filtered.sort((a, b) => (rank[a.status] - rank[b.status]) || (a.fame - b.fame));
  }

  document.getElementById('tableHead').innerHTML = mode === 'end'
    ? `<tr><th>Player</th><th>Medals</th><th>Decks</th><th>History</th><th>Joined</th><th>Status</th><th>Override</th></tr>`
    : `<tr><th>Player</th><th>Medals</th><th>Today</th><th>Max Left</th><th>Ceiling</th><th>Status</th></tr>`;

  const roleMap = { elder: 'E', coLeader: 'Co', leader: 'L' };
  document.getElementById('tableBody').innerHTML = filtered.map(p => {
    const rTag = roleMap[p.role] ? `<span class="role-tag">${roleMap[p.role]}</span>` : '';
    if (mode === 'end') {
      const bTag = p.boats > 0 ? ` <span class="badge b-Boats">${p.boats}b</span>` : '';
      return `<tr>
        <td><b>${p.name}</b>${rTag}</td>
        <td class="mono">${p.fame}</td>
        <td class="mono">${p.decks}/16${bTag}</td>
        <td class="mono">${p.passWks}/${p.wks} · ${p.avg} avg</td>
        <td>
          <select onchange="players[${p.idx}].joined=this.value;render()">
            ${['Full','Thu','Fri','Sat','Sun','Exempt'].map(opt => `<option ${p.joined===opt?'selected':''}>${opt}</option>`).join('')}
          </select>
        </td>
        <td><span class="badge b-${p.status}">${p.status}</span></td>
        <td>
          <select onchange="players[${p.idx}].override=this.value;render()">
            ${['Auto','Kick','Demote','Warn','Hold','Promote','Safe','Exempt'].map(opt => `<option ${p.override===opt?'selected':''}>${opt}</option>`).join('')}
          </select>
        </td>
      </tr>`;
    } else {
      const slot = (p.status === 'Out' && p.usedToday === 0) ? ` <span class="badge b-Promote">Frees slot</span>` : '';
      return `<tr>
        <td><b>${p.name}</b>${rTag}</td>
        <td class="mono">${p.fame}</td>
        <td class="mono">${p.usedToday}/4</td>
        <td class="mono">+${p.maxGain}</td>
        <td class="mono">${p.fame + p.maxGain}</td>
        <td><span class="badge b-${p.status}">${p.status}</span>${slot}</td>
      </tr>`;
    }
  }).join('');

  renderChat(evaluated, r);
}

function renderChat(list, r) {
  const kicks = list.filter(x => x.status === 'Kick').map(x => x.name);
  const demotes = list.filter(x => x.status === 'Demote').map(x => x.name);
  const promotes = list.filter(x => x.status === 'Promote').map(x => x.name);
  const warns = list.filter(x => x.status === 'Warn' || x.status === 'Exempt');
  const holds = list.filter(x => x.status === 'Hold');
  const boaters = list.filter(x => x.boats >= 8);

  const repeatW = warns.filter(x => x.wks - x.passWks >= 2);
  const firstW = warns.filter(x => x.wks - x.passWks < 2);

  const cards = [];

  if (mode === 'end') {
    cards.push({
      title: '1. Kicks & Demotes',
      text: `War update:\n\nKicked:\n${kicks.map(n => '- ' + n).join('\n') || '- None'}\n\nDemoted:\n${demotes.map(n => '- ' + n).join('\n') || '- None'}`
    });
    cards.push({
      title: '2. Promotions',
      text: `Promoted to Elder:\n\n${promotes.map(n => '- ' + n).join('\n') || '- None'}`
    });
    cards.push({
      title: '3. Final Warnings',
      text: `Final warnings (${r.target}+ next war):\n\n${repeatW.map(x => `- ${x.name}: ${x.wks - x.passWks}/${x.wks} wks under`).join('\n')}\n\n1st miss:\n- ${firstW.map(x => x.joined === 'Exempt' ? x.name + ' (exempt)' : x.name).join(', ')}`
    });
    cards.push({
      title: '4. Boat Attackers',
      text: `Good activity from our boat attackers so no kicks, just switch to duels or 1v1!\n\nSame wins in 1v1/duels:\n${boaters.map(x => `- ${x.name}: ${x.fame} -> ${boatMath(x).pvp}+`).join('\n')}`
    });
    if (holds.length) {
      cards.push({
        title: '5. Hold / Check-In',
        text: holds.map(x => `Holding ${x.name}'s spot — offline ${x.offlineDays}d, usually ${r.target}+ every week. Hope all is good!`).join('\n')
      });
    }
  } else {
    const out = list.filter(x => x.status === 'Out');
    const risk = list.filter(x => x.status === 'Risk');
    cards.push({
      title: '1. Eliminated (Day 4)',
      text: `Day 4 update — can't reach ${r.target} with decks left:\n\n${out.map(x => `- ${x.name} (${x.fame}, ${4 - x.usedToday}d left)`).join('\n') || '- None'}`
    });
    cards.push({
      title: '2. Still In Reach',
      text: `Day 4 reminder — still able to hit ${r.target}:\n\n${risk.map(x => `- ${x.name}: need +${r.target - x.fame} (${4 - x.usedToday}d left)`).join('\n') || '- Everyone passed!'}`
    });
  }

  document.getElementById('chatGrid').innerHTML = cards.map((c, i) => {
    const len = c.text.length;
    const color = len <= 250 ? 'var(--accent)' : 'var(--red)';
    return `<div class="card">
      <div class="card-head">
        <span>${c.title}</span>
        <span class="mono" style="color:${color}" id="cnt-${i}">${len}/250</span>
      </div>
      <textarea id="txt-${i}" oninput="updateCount(${i})">${c.text}</textarea>
      <button class="btn" onclick="copyTxt(${i}, this)">Copy</button>
    </div>`;
  }).join('');
}

function updateCount(i) {
  const el = document.getElementById('txt-' + i);
  const cnt = document.getElementById('cnt-' + i);
  cnt.textContent = el.value.length + '/250';
  cnt.style.color = el.value.length <= 250 ? 'var(--accent)' : 'var(--red)';
}

function copyTxt(i, btn) {
  const el = document.getElementById('txt-' + i);
  navigator.clipboard.writeText(el.value);
  const old = btn.textContent;
  btn.textContent = 'Copied';
  setTimeout(() => btn.textContent = old, 1200);
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
  return lines.slice(1).map(line => {
    const vals = line.split(',').map(v => v.trim().replace(/^"|"$/g, ''));
    const obj = {};
    headers.forEach((h, i) => obj[h] = vals[i] ?? '');
    return obj;
  });
}

function handleFiles(fileList) {
  Array.from(fileList).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const rows = parseCSV(e.target.result);
      if (!rows.length) return;
      const cols = Object.keys(rows[0]);
      if (cols.includes('role') && cols.includes('lastSeen')) {
        window._roster = rows;
      } else if (cols.includes('season_key') && cols.includes('player_fame')) {
        window._log = rows;
      } else if (cols.includes('player_decks_used_today')) {
        window._live = rows;
      }
      mergeUploaded();
    };
    reader.readAsText(file);
  });
}

function mergeUploaded() {
  if (!window._roster && !window._log && !window._live) return;
  const roster = window._roster || [];
  const log = window._log || [];
  const live = window._live || [];
  if (!roster.length) return;

  const seasons = [...new Set(log.map(r => r.season_key))];
  const latestSeason = seasons[0];

  players = roster.map(r => {
    const tag = (r.tag || '').replace(/^#/, '');
    const pLog = log.filter(x => (x.player_tag || '').replace(/^#/, '') === tag);
    const cur = pLog.find(x => x.season_key === latestSeason) || {};
    const liveRow = live.find(x => (x.player_tag || '').replace(/^#/, '') === tag) || {};
    const wks = pLog.length || 1;
    const passWks = pLog.filter(x => Number(x.player_fame) >= 1800).length;
    const priorPass = pLog.filter(x => x.season_key !== latestSeason && Number(x.player_fame) >= 1800).length;
    const avg = pLog.length ? Math.round(pLog.reduce((s, x) => s + Number(x.player_fame || 0), 0) / pLog.length) : 0;
    return {
      tag,
      name: r.name,
      role: r.role,
      fame: Number(cur.player_fame ?? liveRow.player_fame ?? 0),
      decks: Number(cur.player_decks_used ?? liveRow.player_decks_used ?? 0),
      boats: Number(cur.player_boat_attacks ?? liveRow.player_boat_attacks ?? 0),
      usedToday: Number(liveRow.player_decks_used_today ?? 0),
      wks,
      passWks,
      consecUnder: Number(cur.player_fame || 0) < 1800 ? 1 : 0,
      priorPass,
      avg,
      offlineDays: 0,
      joined: 'Full',
      override: 'Auto'
    };
  });
  render();
}

function exportMd() {
  const r = getRules();
  const evaluated = players.map(p => ({ ...p, ...evalPlayer(p, r) }));
  const md = [
    '# #WINNING War Audit',
    '',
    `- Target: ${r.target} (${r.daily}/day mid-week)`,
    '',
    '| Player | Role | Medals | Decks | Boats | History | Status |',
    '| :--- | :--- | :---: | :---: | :---: | :--- | :--- |',
    ...evaluated.map(p => `| ${p.name} | ${p.role} | ${p.fame} | ${p.decks}/16 | ${p.boats} | ${p.passWks}/${p.wks} (${p.avg} avg) | **${p.status}** |`)
  ].join('\n');
  const blob = new Blob([md], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'winning-war-audit.md';
  a.click();
}

render();
</script>
