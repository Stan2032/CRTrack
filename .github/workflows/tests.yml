name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/check.mjs
      - run: node tests/function.mjs
      - run: node --no-warnings tests/history.mjs
      - run: node tests/stats.mjs
      - run: node --no-warnings tests/discord.mjs
      - run: node --no-warnings tests/leaders.mjs
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: node tests/ui.mjs
