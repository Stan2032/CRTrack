# Keeps the GitHub Actions used by the tests up to date: one grouped pull request a month, only for releases
# at least a week old (time for early problems to be found and fixed).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
